<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/normalize.css" />

    <style>
      .popup {
        position: fixed;
        top: 30px;
        left: 30px;
        width: 280px;
        padding: 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .popup h2 {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
      }

      .popup p {
        font-size: 13px;
        color: #555;
        margin: 0;
        line-height: 1.5;
      }

      .popup ul {
        font-size: 13px;
        color: #555;
        margin: 0;
        padding-left: 16px;
        line-height: 1.8;
      }

      .popup-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .check-label {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: #555;
        cursor: pointer;
      }

      .btn-close {
        padding: 5px 14px;
        font-size: 13px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }

      .btn-close:hover {
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div class="popup" id="popup">
      <h2>오르미 프론트엔드 13기</h2>
      <p>오르미 부트캠프 신청 사이트 리뉴얼 프로젝트입니다.</p>
      <ul>
        <li>제작 기간: 2026.04.28 ~ 2026.05.12</li>
        <li>개발환경: HTML, CSS</li>
        <li>소스 관리: Github</li>
      </ul>
      <div class="popup-footer">
        <label class="check-label">
          <input type="checkbox" id="today-close" />
          하루 안보기
        </label>
        <button class="btn-close" id="close-btn">닫기</button>
      </div>
    </div>

    <script>
      var popup = document.getElementById("popup");
      var closeBtn = document.getElementById("close-btn");
      var todayClose = document.getElementById("today-close");

      function createCookie() {
        var expire = new Date();
        expire.setDate(expire.getDate() + 1);
        document.cookie = "popupClose=yes; expires=" + expire.toUTCString() + "; path=/";
      }

      function getCookie() {
        if (document.cookie.indexOf("popupClose=yes") !== -1) {
          popup.style.display = "none";
        }
      }

      closeBtn.addEventListener("click", function () {
        if (todayClose.checked) {
          createCookie();
        }
        popup.style.display = "none";
      });

      getCookie();
    </script>
  </body>
</html>
